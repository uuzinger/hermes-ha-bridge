# NOTE THE "Bearer " PREFIX. `!secret` cannot be interpolated into a
# surrounding string, so the secret must be the complete header value.
# Without the scheme, every request returns 401.
hermes_bridge_token: "Bearer CHANGEME_openssl_rand_hex_32"

# Must match the webhook_id in the bridge's HA_WEBHOOK_URL.
hermes_reply_webhook_id: "CHANGEME_openssl_rand_hex_16"
